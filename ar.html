<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>アヒルのAR表示</title>

  <!-- 3DモデルをAR表示する機能を読み込む -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background-color: #202020;
      color: white;
      font-family: sans-serif;
    }

    h1 {
      margin: 0;
      padding: 16px;
      background-color: #111111;
      font-size: 18px;
    }

    model-viewer {
      width: 100%;
      height: calc(100vh - 54px);
    }

    #ar-button {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);

      padding: 14px 24px;
      border: none;
      border-radius: 30px;

      background-color: #e53935;
      color: white;

      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>アヒルのAR表示</h1>

  <model-viewer
    src="./models/Duck.glb"
    alt="アヒルの3Dモデル"

    camera-controls

    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"

    shadow-intensity="1"
    environment-image="neutral">

    <button
      id="ar-button"
      slot="ar-button">
      カメラでAR表示
    </button>

  </model-viewer>
</body>
</html>
