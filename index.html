<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 3D表示</title>
  <style>
    /* すべての要素でサイズ計算を統一する*/
    * {
      box-sizing:border-box;
    }

    /* ページ全体*/
    body {
      margin:0;
      overflow:hidden;
      background-color:#202020;
      color: white;
      font-family: sans-serif;
    }
    /*タイトルとボタンを置く上部領域*/
    #toolbar {
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #111111;
    }
    /*タイトル*/
    #toolbar h1 {
      margin: 0;
      font-size: 18px;
    }
    /*右上のボタンを横に並べる*/
    #toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /*ARページを開くボタン*/
    #ar-link {
      padding: 10px 14px;
      border-radius: 6px;
      background-color: #1976d2;
      color: white;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }
    #ar-link:active {
      transform: scale(0.96);
    }
    
    /*正面に戻すボタン*/
    #reset-button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background-color: #e53935;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    /*ボタンを押しているとき*/
    #reset-button:active {
      transform: scale(0.96);
    }
    /*3D表示領域*/
    #scene-container {
      width: 100%;
      height: calc(100vh - 64px);
      touch-action: none;
    }
    /*Three.jsが作る描画画面*/
    #scene-container canvas {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Three.js 3D表示テスト</h1>
  <!--div=3D画面を入れるための箱, id="scene-container": その箱につけた名前, THREE: 読み込んだ機能全体につける名前-->
  <div id="toolbar">
    <h1>3Dモデルビューア</h1>
    <div id="toolbar-actions">
      <a id="ar-link" href="./ar.html">
        ARで見る
      </a>
      
    <button id="reset-button">
      正面に戻す
    </button>
    </div>
  </div>

  <div id="scene-container"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    import {
      OrbitControls
    } from "three/addons/controls/OrbitControls.js";

    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    //3D表示領域を取得する
    const container = document.getElementById("scene-container");

    //カメラの視野角が75°, Window.innerHeight/ window.innerWidth: 画面の縦横比, 0.1~1000:0.1より近いものは映さない, 1000より遠い物は映さない, カメラを手前に5だけ移動するという意味。
    const camera = new THREE.PerspectiveCamera(
      75,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.z = 5;

  //3D空間をブラウザに描画する装置, new THREE.WebGRenderer(): WebGLを使う描画装置を作る, renderer.setSize():3D画面の幅と高さを設定する
  const renderer = new THREE.WebGLRenderer();
  
  //影の描画を有効にする
  renderer.shadowMap.enabled = true;

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  //appendChild(renderer.domElement):その箱の中に3D画面を追加する
  container.appendChild(renderer.domElement);
  
  //マウスでカメラを操作できるようにする
  const controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  //動きを滑らかにする
  controls.enableDamping = true;

  //カメラが見る中心を立方体に合わせる
  controls.enableDamping = true;
  controls.target.set(0, -0.1, 0);
  
  //操作範囲を制限する
  controls.minDistance = 2;
  controls.maxDistance = 10;
  controls.maxPolarAngle = Math.PI / 2;

  controls.update();
  //現在のカメラ位置を初期位置として保存する
  controls.saveState();

  //正面に戻すボタンが押されたとき
  document
    .getElementById("reset-button")
    .addEventListener("click", function () {
      //カメラを初期位置に戻す
      controls.reset();
    });
  
  //立方体の形を作る, (1,1,1):幅・高さ・奥行
  const geometry = new THREE.BoxGeometry(1,1,1);

  //立方体の表面を作る
  const material = new THREE.MeshStandardMaterial({
    color: 0x00ff00
  });

  //形と表面を組み合わせて立方体を作る
  const cube = new THREE.Mesh(geometry, material);

  //立方体を3D空間に追加する
  scene.add(cube);

  //立方体を影で作るようにする
  cube.castShadow = true;

  //立方体を床の上まで下げる
  cube.position.y = -0.1;

  //白い光を作る
  const light = new THREE.DirectionalLight(
    0xffffff,
    3
  );

  //光を右上・手前に置く
  light.position.set(3,3,5);

  //メインの光
  scene.add(light);
  light.castShadow = true;

  //暗い部分を補う光
  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.9
  );

  scene.add(ambientLight);

  //床の形を作る
  const floorGeometry = new THREE.PlaneGeometry(10,10);

  //床の表面を作る
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x555555
  });

  //床を作る
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);

  //床水平にする
  floor.rotation.x = -Math.PI / 2;

  //床を立方体より下に移動する
  floor.position.y = -1;

  //床を3D空間に追加する
  scene.add(floor);

  //床が影を受け取るようにする
  floor.receiveShadow = true;

  //GLBモデルを読み込む準備
  const loader = new GLTFLoader();

  //modelsフォルダーのDuck.glbを読み込む
  loader.load(
    "./models/Duck.glb",
    //読み込みに成功したとき
    function (gltf) {
      const duck = gltf.scene;

      //アヒルを構成する全部品を順番に確認する
      duck.traverse(function (child) {
        //その部品が3D形状なら影を有効にする
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      })

      //アヒルを床の位置へ移動する
      duck.position.set(0,-1, 0);

      //3D空間に追加する
      scene.add(duck);

      //練習用の立方体を非表示にする
      cube.visible = false;
    },
    //読み込み状況（今回は使わない）
    undefined,
    //読み込みに失敗したとき
    function (error) {
      console.error("3Dモデルの読み込みに失敗しました", error
        
      );
    }
  );

  //立方体を少し回転させる
  cube.rotation.x = 0.5;
  cube.rotation.y = 0.5;

  //立方体を連続して動かす
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;

    renderer.render(scene, camera);
  }

  //アニメーションを開始する
  animate();

  //ブラウザの大きさが変わったときに実行する
  window.addEventListener("resize", function(){

    //3D表示領域の新しい幅と高さを取得する
    const width = container.clientWidth;
    const height = container.clientHeight;

    //カメラの縦横比を更新する
    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    //描画画面の大きさを更新する
    renderer.setSize(width, height);
  });
  </script>
</body>
</html>
